name: scrappy-meals

# Docker never rotates container logs by default; on a small disk they grow forever.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-ops: &ops
  build: ./backup
  image: scrappy-meals-ops:local
  profiles: [ops]
  logging: *logging
  depends_on:
    postgres:
      condition: service_healthy
  environment: &ops-env
    PGHOST: postgres
    PGUSER: postgres
    PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
    S3_BUCKET: ${S3_BUCKET:-}
    S3_REGION: ${S3_REGION:-eu-central-1}
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    AGE_RECIPIENT: ${AGE_RECIPIENT:-}
    TZ: ${TZ:-UTC}
    # Disk-backed scratch space (an anonymous volume, see each service): the
    # dumps can outgrow RAM, so not a tmpfs.
    TMPDIR: /work

services:
  postgres:
    # A new major version needs a dump and restore: docs/deploy.md, "Upgrading Postgres".
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      PLANNER_DB_PASSWORD: ${PLANNER_DB_PASSWORD:?}
      MEALIE_DB_PASSWORD: ${MEALIE_DB_PASSWORD:?}
      TZ: ${TZ:-UTC}
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during first boot the image runs a socket-only server while
      # postgres/init creates the roles, and that one must not count as ready.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    restart: unless-stopped
    logging: *logging

  mealie:
    image: ${MEALIE_IMAGE:-ghcr.io/mealie-recipes/mealie}:v3.29.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_ENGINE: postgres
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealie
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: ${MEALIE_DB_PASSWORD:?}
      BASE_URL: https://recipes.${DOMAIN:?}
      ALLOW_SIGNUP: "false"
      UVICORN_WORKERS: 1
      TZ: ${TZ:-UTC}
    volumes:
      - mealie-data:/app/data
    mem_limit: 1g
    restart: unless-stopped
    logging: *logging

  app:
    image: ${APP_IMAGE:?set APP_IMAGE, e.g. ghcr.io/<owner>/scrappy-meals}:${APP_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      mealie:
        condition: service_started
    environment:
      DATABASE_URL: postgres://planner:${PLANNER_DB_PASSWORD:?}@postgres:5432/planner
      MEALIE_URL: http://mealie:9000
      # Only used to link people to Mealie pages (e.g. "Edit in Mealie" on a recipe).
      MEALIE_PUBLIC_URL: https://recipes.${DOMAIN:?}
      MEALIE_API_TOKEN: ${MEALIE_API_TOKEN:-}
      AUTH_SECRET: ${AUTH_SECRET:?}
      # Optional; contributing products to Open Food Facts is off unless both are set.
      OFF_USER_ID: ${OFF_USER_ID:-}
      OFF_PASSWORD: ${OFF_PASSWORD:-}
      # Optional; estimating missing nutrition with Claude is off unless set.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AUTH_URL: https://app.${DOMAIN:?}
      AUTH_TRUST_HOST: "true"
      TZ: ${TZ:-UTC}
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging

  # Monitoring (Beszel): CPU, memory, disk and network for the server and each
  # container. The agent exits until it has the hub's key: docs/deploy.md,
  # "Monitoring".
  beszel:
    image: henrygd/beszel:0.21.0@sha256:6b39a8b64f9b15d00a25e7683e31a93c46161182a54f62713525107064e10599
    environment:
      APP_URL: http://localhost:8090
      TZ: ${TZ:-UTC}
    # Loopback only: the dashboard is reached through an SSH tunnel, never Caddy.
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - beszel-data:/beszel_data
      - beszel-socket:/beszel_socket
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging

  beszel-agent:
    image: henrygd/beszel-agent:0.21.0@sha256:f27b1aa2c68404bc5b9e1a2ab36653bd9b4ee14f6299862f09cd5051a4134767
    # Host networking so it sees the server's own network interfaces. It
    # listens on a socket shared with the hub, so it opens no port.
    network_mode: host
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
      KEY: ${BESZEL_AGENT_KEY:-}
      TOKEN: ${BESZEL_AGENT_TOKEN:-}
      TZ: ${TZ:-UTC}
    volumes:
      - beszel-agent-data:/var/lib/beszel-agent
      - beszel-socket:/beszel_socket
      # For per-container stats. Read-only doesn't limit the Docker API: this
      # is root-equivalent access to the server.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging

  # Nightly backup, run from host cron: docker compose run --rm backup
  # Write-only S3 credentials; cannot read or delete existing backups.
  backup:
    <<: *ops
    command: ["backup"]
    environment:
      <<: *ops-env
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
    volumes:
      - mealie-data:/mealie-data:ro
      - /work

  # Used only by scripts/restore.sh. Gets read credentials and the age
  # identity at run time; nothing restore-related lives in .env on the VPS.
  restore:
    <<: *ops
    environment:
      <<: *ops-env
      AWS_ACCESS_KEY_ID: ${RESTORE_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${RESTORE_AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${RESTORE_AWS_SESSION_TOKEN:-}
      # pg_restore connects as each app role rather than the superuser.
      PLANNER_DB_PASSWORD: ${PLANNER_DB_PASSWORD:?}
      MEALIE_DB_PASSWORD: ${MEALIE_DB_PASSWORD:?}
    volumes:
      - mealie-data:/mealie-data
      - ${RESTORE_WORKDIR:-./restore-work}:/restore
      - ${AGE_IDENTITY_FILE:-/dev/null}:/run/age-identity:ro
      - /work

volumes:
  pgdata: {}
  mealie-data: {}
  caddy-data: {}
  caddy-config: {}
  beszel-data: {}
  beszel-agent-data: {}
  beszel-socket: {}
