# Bumps the pinned action SHAs and image digests. npm packages are updated by
# hand with `bun run update-packages` (see AGENTS.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/app, /backup]
    schedule:
      interval: monthly
    ignore:
      # A Postgres major is a dump and restore (docs/deploy.md), not a bump.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      # A Postgres major is a dump and restore (docs/deploy.md), not a bump.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
