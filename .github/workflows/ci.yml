name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway database that only exists for this job, so no password.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: planner_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mealie:
        # Must match docker-compose.yml; uses Mealie's built-in SQLite and default admin.
        image: ghcr.io/mealie-recipes/mealie:v3.29.0
        env:
          ALLOW_SIGNUP: "false"
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format (oxfmt)
        run: pnpm format:check
      - name: Lint (oxlint)
        run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db
        env:
          DATABASE_TEST_URL: postgres://postgres@localhost:5432/planner_test
      - name: Wait for Mealie
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:9000/api/app/about && exit 0; sleep 3; done
          exit 1
      - run: pnpm test:integration
        env:
          MEALIE_TEST_URL: http://localhost:9000
          DATABASE_TEST_URL: postgres://postgres@localhost:5432/planner_test
      - name: Migrations match the schema
        run: |
          DATABASE_URL=unused pnpm drizzle-kit generate --name ci-check
          git diff --exit-code -- drizzle || (echo "::error::schema.ts changed without a migration; run pnpm drizzle-kit generate" && exit 1)
          test -z "$(git status --porcelain -- drizzle)" || (echo "::error::uncommitted migration generated" && exit 1)

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: planner_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mealie:
        image: ghcr.io/mealie-recipes/mealie:v3.29.0
        env:
          ALLOW_SIGNUP: "false"
        ports: ["9000:9000"]
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/planner_e2e
      MEALIE_URL: http://localhost:9000
      MEALIE_PUBLIC_URL: http://localhost:9000
      MEALIE_TEST_URL: http://localhost:9000
      AUTH_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      E2E_ALLOW_RESET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Assemble the standalone server
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
      - run: pnpm exec playwright install --with-deps chromium
      - name: Wait for Mealie and create an API token for the app
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:9000/api/app/about >/dev/null && break; sleep 3; done
          jwt=$(curl -fsS -X POST http://localhost:9000/api/auth/token \
            -d 'username=changeme@example.com&password=MyPassword' | jq -r .access_token)
          token=$(curl -fsS -X POST http://localhost:9000/api/users/api-tokens \
            -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' -d '{"name":"ci-e2e"}' | jq -r .token)
          echo "::add-mask::$token"
          echo "MEALIE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Start the app
        run: |
          node dist/migrate.cjs
          nohup node .next/standalone/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
            app/server.log
          retention-days: 7

  # Decides whether a PR can affect the image or the backups; pushes to main and
  # tags always run both.
  changes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      image: ${{ steps.diff.outputs.image }}
      backup: ${{ steps.diff.outputs.backup }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          # Anything that goes into the image or the way CI builds it.
          PATTERN: '^(app/(Dockerfile|\.dockerignore|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|next\.config\.ts|docker/|scripts/|drizzle/|src/cli/|src/server/db/|src/server/users\.ts)|backup/|\.github/workflows/)'
          # Anything the backup/restore round trip exercises.
          BACKUP_PATTERN: '^(backup/|scripts/|postgres/|docker-compose\.yml|\.github/workflows/)'
        run: |
          check() {
            if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            elif git diff --name-only "$BASE" HEAD | grep -E "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "No $1-related changes; the $1 job is skipped."
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check image "$PATTERN"
          check backup "$BACKUP_PATTERN"

  secrets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: 8.28.0
          SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf /tmp/gitleaks.tgz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan full history
        run: gitleaks git --redact --verbose .

  backup:
    needs: [changes]
    if: needs.changes.outputs.backup == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Backup and restore round trip
        run: scripts/test-backup-restore.sh

  # Pull requests: build and smoke-test only, never push.
  # main:          publish :main and :sha-<commit>. Never :latest.
  # v* tags:       publish :X.Y.Z, :X.Y and :latest. Only a release moves :latest,
  #                which is what the server runs by default (APP_TAG).
  image:
    needs: [changes, check, e2e, secrets]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          tags: scrappy-meals:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build backup image
        uses: docker/build-push-action@v6
        with:
          context: backup
          tags: scrappy-meals-ops:ci
      - name: Smoke test the app image
        run: |
          docker network create smoke
          docker run -d --name db --network smoke -e POSTGRES_HOST_AUTH_METHOD=trust postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 1; done
          docker run -d --name app --network smoke -p 3000:3000 \
            -e DATABASE_URL=postgres://postgres@db:5432/postgres \
            -e AUTH_SECRET="$(openssl rand -hex 32)" -e AUTH_URL=http://localhost:3000 \
            -e MEALIE_URL=http://mealie.invalid -e MEALIE_API_TOKEN=unused \
            scrappy-meals:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && break; sleep 2; done
          curl -fsS http://localhost:3000/api/health | grep -q '"db":true'
          printf '%s\n' 'ci password 12345' 'ci password 12345' \
            | docker exec -i app scrappy user add --name CI --email ci@example.test
          docker exec app scrappy user list | grep -q ci@example.test
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:3000/login | grep -q 200
      - name: Show app logs
        if: failure()
        run: docker logs app || true
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push app image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
