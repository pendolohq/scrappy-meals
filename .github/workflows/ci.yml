name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          # Throwaway database that only exists for this job, so no password.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: planner_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mealie:
        # Must match docker-compose.yml; uses Mealie's built-in SQLite and default admin.
        image: ghcr.io/mealie-recipes/mealie:v3.29.0
        env:
          ALLOW_SIGNUP: "false"
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - name: Format (oxfmt)
        run: bun run format:check
      - name: Lint (oxlint)
        run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:db
        env:
          DATABASE_TEST_URL: postgres://postgres@localhost:5432/planner_test
      - name: Wait for Mealie
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:9000/api/app/about && exit 0; sleep 3; done
          exit 1
      - run: bun run test:integration
        env:
          MEALIE_TEST_URL: http://localhost:9000
          DATABASE_TEST_URL: postgres://postgres@localhost:5432/planner_test
      - name: Migrations match the schema
        run: |
          DATABASE_URL=unused bunx drizzle-kit generate --name ci-check
          git diff --exit-code -- drizzle || (echo "::error::schema.ts changed without a migration; run bunx drizzle-kit generate" && exit 1)
          test -z "$(git status --porcelain -- drizzle)" || (echo "::error::uncommitted migration generated" && exit 1)

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: planner_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    # Mealie isn't a service here: services start before the first step, so
    # its ~1 GB image would be pulled while nothing else runs. Started as the
    # first step instead, it downloads while the app builds.
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/planner_e2e
      MEALIE_URL: http://localhost:9000
      MEALIE_PUBLIC_URL: http://localhost:9000
      MEALIE_TEST_URL: http://localhost:9000
      AUTH_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      E2E_ALLOW_RESET: "1"
    steps:
      - name: Start Mealie
        working-directory: .
        run: |
          docker run -d --name mealie -p 9000:9000 -e ALLOW_SIGNUP=false \
            ghcr.io/mealie-recipes/mealie:v3.29.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Assemble the standalone server
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      # The cache holds the browser, not the system libraries it needs.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - name: Wait for Mealie and create an API token for the app
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:9000/api/app/about >/dev/null && break; sleep 3; done
          jwt=$(curl -fsS -X POST http://localhost:9000/api/auth/token \
            -d 'username=changeme@example.com&password=MyPassword' | jq -r .access_token)
          token=$(curl -fsS -X POST http://localhost:9000/api/users/api-tokens \
            -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' -d '{"name":"ci-e2e"}' | jq -r .token)
          echo "::add-mask::$token"
          echo "MEALIE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Start the app
        run: |
          node dist/migrate.cjs
          nohup node .next/standalone/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: bun run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
            app/server.log
          retention-days: 7

  # Decides whether a PR can affect the image or the server stack (compose,
  # Caddy, backups); pushes to main and tags always run both.
  changes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      image: ${{ steps.diff.outputs.image }}
      stack: ${{ steps.diff.outputs.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          # What the stack job checks.
          STACK_PATTERN: '^(backup/|scripts/|postgres/|docker-compose\.yml|Caddyfile|\.env\.example|\.github/workflows/)'
        run: |
          # .github/image-paths: one regex per line, comments and blanks ignored.
          IMAGE_PATTERN="^($(grep -v -e '^#' -e '^$' .github/image-paths 2>/dev/null | paste -sd'|' -))"
          check() {
            if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            elif git diff --name-only "$BASE" HEAD | grep -E "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "No $1-related changes; the $1 job is skipped."
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check image "$IMAGE_PATTERN"
          check stack "$STACK_PATTERN"

  secrets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: 8.28.0
          SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf /tmp/gitleaks.tgz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan full history
        run: gitleaks git --redact --verbose .

  stack:
    needs: [changes]
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose file and Caddyfile are valid
        run: |
          sed -E 's/^(POSTGRES_SUPERUSER_PASSWORD|PLANNER_DB_PASSWORD|MEALIE_DB_PASSWORD|AUTH_SECRET)=$/\1=ci/' \
            .env.example > .env
          docker compose --profile ops config -q
          docker run --rm -e DOMAIN=example.test -e ACME_EMAIL=ci@example.test \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$(sed -n 's/^ *image: \(caddy:.*\)/\1/p' docker-compose.yml)" caddy validate --config /etc/caddy/Caddyfile
          rm .env
      - name: Backup and restore round trip
        run: scripts/test-backup-restore.sh

  # Pull requests: build and smoke-test only, never push.
  # main:          publish :main and :sha-<commit>. Never :latest.
  # v* tags:       publish :X.Y.Z, :X.Y and :latest. Only a release moves :latest,
  #                which is what the server runs by default (APP_TAG).
  image:
    needs: [changes, check, e2e, secrets]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Not for prereleases (v1.0.0-rc.1): a server on APP_TAG=latest would pick them up.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - name: Build app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          load: true
          tags: scrappy-meals:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the app image
        # As in production: postgres/init creates the roles, and migrations run
        # as the non-superuser planner role.
        run: |
          docker network create smoke
          docker run -d --name db --network smoke \
            -e POSTGRES_PASSWORD=smoke -e PLANNER_DB_PASSWORD=smoke -e MEALIE_DB_PASSWORD=smoke \
            -v "$PWD/postgres/init:/docker-entrypoint-initdb.d:ro" \
            postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          for i in $(seq 1 30); do docker exec db pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
          docker run -d --name app --network smoke -p 3000:3000 \
            -e DATABASE_URL=postgres://planner:smoke@db:5432/planner \
            -e AUTH_SECRET="$(openssl rand -hex 32)" -e AUTH_URL=http://localhost:3000 \
            -e MEALIE_URL=http://mealie.invalid -e MEALIE_API_TOKEN=unused \
            scrappy-meals:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && break; sleep 2; done
          curl -fsS http://localhost:3000/api/health | grep -q '"db":true'
          printf '%s\n' 'ci password 12345' 'ci password 12345' \
            | docker exec -i app scrappy user add --name CI --email ci@example.test
          docker exec app scrappy user list | grep -q ci@example.test
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:3000/login | grep -q 200
      - name: Show app logs
        if: failure()
        run: docker logs app || true
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push the image that was just smoke-tested, not a rebuild of it.
      - name: Push app image
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag scrappy-meals:ci "$tag"
            docker push "$tag"
          done
